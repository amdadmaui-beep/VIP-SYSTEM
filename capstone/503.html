<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 — Service Unavailable</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding: 24px; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
        .card { max-width: 420px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
        .icon { width: 72px; height: 72px; margin: 0 auto 12px auto; border-radius: 20px; background: #fffbeb; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #d97706; }
        .title { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; }
        .text { color: #475569; font-size: 0.92rem; line-height: 1.45; }
        .hint { margin-top: 12px; font-size: 0.85rem; color: #64748b; }
        .btn { display: inline-block; margin-top: 16px; padding: 10px 24px; background: #6366f1; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">503</div>
        <div class="title">Service Unavailable</div>
        <div class="text">The system is temporarily down for maintenance or experiencing high traffic. Please try again shortly.</div>
        <div class="hint">If the problem persists, contact the system administrator.</div>
        <a href="/" class="btn">Try Again</a>
    </div>
</body>
</html>
