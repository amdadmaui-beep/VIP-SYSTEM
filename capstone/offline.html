<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            margin: 0;
            padding: 24px;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .card {
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 12px auto;
            border-radius: 20px;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; }
        .text { color: #475569; font-size: 0.92rem; line-height: 1.45; }
        .hint { margin-top: 12px; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="assets/images/vip_logo.jpg" alt="VIP" style="width:52px;height:52px;border-radius:14px;">
        </div>
        <div class="title">You’re offline</div>
        <div class="text">Please check your internet connection and try again.</div>
        <div class="hint">Tip: reopen the app after reconnecting.</div>
    </div>
</body>
</html>
